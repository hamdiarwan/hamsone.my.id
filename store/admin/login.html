<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login admin — HamsOne Store</title>
<link rel="icon" href="../assets/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>
<div style="background:#C8FF2E;color:#0B0F00;text-align:center;font:600 13px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;padding:9px 16px;position:relative;z-index:100">Mode pratinjau &mdash; pembayaran belum aktif. Toko segera buka.</div>


<div class="auth">
<div class="auth-side"><a class="logo" href="../index.html"><img src="../assets/logo-icon.svg" alt="">HamsOne<b>Store</b></a>
<div><h2>Kelola toko<br>dari satu tempat.</h2><p class="muted" style="margin-top:14px;max-width:380px">Stok, pesanan, dan pembayaran HamsOne Store.</p></div>
<p class="dim" style="font-size:.84rem">Khusus admin. Akses dicatat.</p></div>
<div class="auth-main"><form class="auth-box" action="index.html">
<div style="margin-bottom:30px"><img src="../assets/logo-icon.svg" width="44" alt=""><h2 style="font-size:1.8rem;margin-top:22px">Masuk admin</h2><p class="muted" style="margin-top:6px">Masukkan kredensial admin kamu.</p></div>
<div class="field"><label class="label">Email</label><input class="input" type="email" placeholder="admin@hamsone.my.id"></div>
<div class="field"><div class="row between"><label class="label">Password</label><a class="accent" style="font-size:.82rem;margin-bottom:8px" href="#">Lupa password?</a></div><input class="input" type="password" placeholder="••••••••"></div>
<label class="row" style="margin:18px 0;font-size:.9rem;color:var(--muted)"><input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px"> Ingat perangkat ini</label>
<button class="btn btn-primary btn-lg btn-block">Masuk</button>
<p class="center" style="margin-top:22px;font-size:.88rem"><a class="muted" href="../index.html">← Kembali ke toko</a></p>
</form></div></div><script src="../assets/app.js"></script></body></html>
